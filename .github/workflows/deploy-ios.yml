name: Deploy iOS to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-ios-production
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build with EAS and submit to TestFlight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check for Expo token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "Add an EXPO_TOKEN repository secret before running this workflow."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build production app and submit to TestFlight
        run: eas build --platform ios --profile production --auto-submit-with-profile production --non-interactive --no-wait
